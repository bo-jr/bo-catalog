# Values for the shared chart, oci://ghcr.io/bo-jr/charts/service.
#
# chartVersion pins the chart by exact version: rendering these values with any
# other chart version fails. image.digest and commitTimestamp are supplied at
# render time — by CI, or by `task sandbox:deploy` in bo-platform — and are
# never committed here.
chartVersion: 0.2.0
name: catalog
version: v1
image:
  repository: ghcr.io/bo-jr/bo-catalog
  digest: ""
workload: Deployment
replicas: 1
dependencies: []
env:
  FAILURE_RATE: "0"
  EXTRA_LATENCY_MS: "0"
# The Secret CloudNativePG generates for the catalog-db Cluster, which lives in
# bo-platform/databases/<env>/. Phase 7 moves its source to OpenBao via ESO; this
# reference does not change. See bo-platform DECISIONS.md 2026-09-29.
secretEnv:
  - { name: DATABASE_URL, secret: catalog-db-app, key: uri }
otlpEndpoint: ""
resources:
  requests: { cpu: 50m,  memory: 64Mi }
  limits:   { cpu: 500m, memory: 128Mi }
